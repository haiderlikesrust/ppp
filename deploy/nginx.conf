map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;
    root /usr/share/nginx/html;

    # Docker DNS is resolved on requests, so replacing the server container does not leave
    # the gateway pointing to its previous address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:4100;

    # Set here only: an add_header inside a location would silently drop these.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Card images come from Collector Crypt / Arweave / IPFS over https. Wallet extensions talk to the
    # page directly, and every network call the site makes goes to its own /api.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    location /api/ {
        # The API sets its own security headers; avoid sending them twice.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Single-page app: unknown paths (/claim, /pool, /docs, /admin) load index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
