services:
  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - dokploy-network
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    # Give in-flight payouts time to persist before the container stops.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: "4100"
      # Exactly two trusted proxies: Dokploy Traefik -> gateway -> server.
      TRUST_PROXY_HOPS: "2"
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your exact HTTPS domain}
      DATABASE_URL: postgres://pullprotection:${POSTGRES_PASSWORD:?Set a long alphanumeric POSTGRES_PASSWORD}@postgres:5432/pullprotection
      MAINNET_ENABLED: ${MAINNET_ENABLED:-false}
      MEMECOIN_MINT: ${MEMECOIN_MINT:-}
      OWNER_WALLET: ${OWNER_WALLET:-}
      OPS_PRIVATE_KEY: ${OPS_PRIVATE_KEY:-}
      POOL_PRIVATE_KEY: ${POOL_PRIVATE_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      DAS_RPC_URL: ${DAS_RPC_URL:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      COLLECTOR_CRYPT_API_KEY: ${COLLECTOR_CRYPT_API_KEY:-}
      COLLECTOR_CRYPT_PAYMENT_WALLET: ${COLLECTOR_CRYPT_PAYMENT_WALLET:-GachaNgyXTU3zFogQ8Z5jR2BLXs8215X2AtEH18VxJq3}
      CARDS_MINT: ${CARDS_MINT:-CARDSccUMFKoPRZxt5vt3ksUbxEFEcnZ3H2pd3dKxYjp}
      USDC_MINT: ${USDC_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      GAS_RESERVE_SOL: ${GAS_RESERVE_SOL:-0.05}
      SLIPPAGE_BPS: ${SLIPPAGE_BPS:-100}
    volumes:
      - pull-protection-reports:/app/reports
    networks:
      - app
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pullprotection
      POSTGRES_DB: pullprotection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a long alphanumeric POSTGRES_PASSWORD}
    volumes:
      - pull-protection-postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pullprotection -d pullprotection"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pull-protection-postgres:
  pull-protection-reports:

networks:
  dokploy-network:
    external: true
  app:
  database:
    internal: true
